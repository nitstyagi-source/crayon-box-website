# MediaMTX Configuration for Crayon Box School Live Video Gateway
# Hikvision DVR: 192.168.1.90 | Port: 10554 | User: admin

logLevel: info
logDestinations: [stdout]

# High Performance Real-Time Streaming Server (WebRTC WHEP & Low-Latency HLS)
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ['*']
webrtcHandshakeTimeout: 10s

# High Performance Low-Latency HLS Server
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsSegmentCount: 3
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAlwaysRemux: yes
hlsAllowOrigins: ['*']

authMethod: internal
authInternalUsers:
  - user: any
    pass: ""
    permissions:
      - action: publish
        path: ""
      - action: read
        path: ""
      - action: playback
        path: ""
      - action: api
        path: ""

paths:
  all:
    sourceOnDemand: no

  nursery_cam:
    source: rtsp://admin:master123@192.168.1.90:10554/Streaming/Channels/102
    rtspTransport: tcp
    sourceOnDemand: no


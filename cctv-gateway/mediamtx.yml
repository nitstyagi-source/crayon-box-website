# MediaMTX Configuration for Crayon Box School Live Streaming Gateway
# Hikvision DVR: 192.168.1.90 | Port: 10554 | User: admin

logLevel: info
logDestinations: [stdout]

# Disable RTSP, RTMP, WebRTC server listeners to eliminate port conflicts
rtsp: no
rtmp: no
webrtc: no
srt: no

# HLS Server (For Web Browsers & Parent Portal)
hls: yes
hlsAddress: :8888
hlsVariant: mpegts
hlsSegmentCount: 5
hlsSegmentDuration: 1s
hlsAlwaysRemux: yes

# 16-Channel Classroom Mapping (Port 10554)
paths:
  nursery_cam:
    source: rtsp://admin:master123@192.168.1.90:10554/Streaming/Channels/102
    rtspTransport: tcp

